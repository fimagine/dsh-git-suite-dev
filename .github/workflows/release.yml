name: Release

# v1.0.0            -> stable release (GitHub latest + npm latest)
# v1.0.0-preview-0  -> preview release (GitHub prerelease + npm preview dist-tag)
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate tag and version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-preview-[0-9]+)?$ ]]; then
            echo "Unsupported tag: $tag. Use vX.Y.Z (stable) or vX.Y.Z-preview-N (preview)." >&2
            exit 1
          fi
          version="${tag#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$package_version" != "$version" ]]; then
            echo "package.json version ($package_version) must equal the tag version ($version)." >&2
            echo "Bump package.json to $version before tagging." >&2
            exit 1
          fi
          if [[ "$tag" == *-preview-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and pack
        run: npm pack

      - name: Publish to npm
        if: ${{ secrets.NPM_TOKEN != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.meta.outputs.prerelease }}" == "true" ]]; then
            npm publish --tag preview
          else
            npm publish
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: dsh-git-suite-*.tgz
          body: |
            Prebuilt bundle: download `dsh-git-suite-${{ steps.meta.outputs.version }}.tgz`, extract it, and add the directory in DSH Plugin Manager (**Plugins → Add plugin**). No build required.

            Or install the `dsh-git-suite` npm package (preview releases use the `preview` dist-tag).
